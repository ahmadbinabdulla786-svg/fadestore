<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - FADE Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #2c2a29; --accent-color: #b89b72; --bg-color: #fcfbf7; --border-color: #e8e3d9; --font-heading: 'Playfair Display', serif; --font-body: 'Inter', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--primary-color); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .auth-container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h2 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 5px; }
        .auth-header p { font-size: 14px; color: #666; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: var(--font-body); font-size: 14px; outline: none; background: var(--bg-color); transition: 0.3s; }
        .form-control:focus { border-color: var(--accent-color); background: #fff; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; background: var(--primary-color); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: var(--accent-color); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .toggle-text span { color: var(--accent-color); font-weight: 600; cursor: pointer; }
        
        .error-msg { color: #d32f2f; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; background: #ffebee; padding: 10px; border-radius: 5px; }
        
        /* Hide Register Form Initially */
        #register-box { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Box -->
        <div id="login-box">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Login to your FADE account</p>
            </div>
            <div class="error-msg" id="login-error"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="l-email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="l-password" class="form-control" placeholder="Enter your password">
            </div>
            <button class="btn" id="login-btn" onclick="loginUser()">Login</button>
            <div class="toggle-text">Don't have an account? <span onclick="toggleForms()">Register here</span></div>
        </div>

        <!-- Register Box -->
        <div id="register-box">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join FADE to track your orders</p>
            </div>
            <div class="error-msg" id="register-error"></div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="r-name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="r-email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="r-password" class="form-control" placeholder="Create a password (min 6 chars)">
            </div>
            <button class="btn" id="register-btn" onclick="registerUser()">Register</button>
            <div class="toggle-text">Already have an account? <span onclick="toggleForms()">Login here</span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8cYU0tb5kkpUiiXawgqa8usuBiexPivg",
            authDomain: "fadestore-fa311.firebaseapp.com",
            projectId: "fadestore-fa311",
            storageBucket: "fadestore-fa311.firebasestorage.app",
            messagingSenderId: "713477757029",
            appId: "1:713477757029:web:0997af2eb72e9dc1bb4e8c",
            measurementId: "G-WW2N8F77VZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Toggle
        window.toggleForms = function() {
            const loginBox = document.getElementById('login-box');
            const regBox = document.getElementById('register-box');
            if(loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                regBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            }
        }

        // Register User
        window.registerUser = async function() {
            const name = document.getElementById('r-name').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const password = document.getElementById('r-password').value;
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('register-error');

            if(!name || !email || !password) return showError(errorDiv, "Please fill all fields.");
            if(password.length < 6) return showError(errorDiv, "Password must be at least 6 characters.");

            btn.innerText = 'Creating Account...'; btn.disabled = true; errorDiv.style.display = 'none';

            try {
                // 1. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Update Profile Name
                await updateProfile(user, { displayName: name });

                // 3. Save User Data to Firestore (Users Collection)
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString()
                });

                alert("Account created successfully! Redirecting...");
                window.location.href = "index.html";
            } catch (error) {
                showError(errorDiv, error.message);
            } finally {
                btn.innerText = 'Register'; btn.disabled = false;
            }
        }

        // Login User
        window.loginUser = async function() {
            const email = document.getElementById('l-email').value.trim();
            const password = document.getElementById('l-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');

            if(!email || !password) return showError(errorDiv, "Please enter email and password.");

            btn.innerText = 'Logging in...'; btn.disabled = true; errorDiv.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Login Successful!");
                window.location.href = "index.html";
            } catch (error) {
                showError(errorDiv, "Invalid email or password.");
            } finally {
                btn.innerText = 'Login'; btn.disabled = false;
            }
        }

        function showError(element, msg) {
            element.innerText = msg;
            element.style.display = 'block';
        }
    </script>
</body>
</html>
